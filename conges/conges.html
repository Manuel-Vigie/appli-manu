<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Congés</title>
<link rel="manifest" href="conges-manifest.webmanifest">
<meta name="theme-color" content="#0e7c86">
<link rel="icon" href="conges-icon-192.png">
<link rel="apple-touch-icon" href="conges-apple-touch-icon.png">
<style>
  :root {
    --bg: #faf6ee; --panel: #ffffff; --fg: #1d2b33; --muted: #66747c; --line: #e8e1d3;
    --accent: #0e7c86; --on-accent: #ffffff; --track: #ece6d9; --we: #f5f0e5;
    --sun: #f0a202; --crit: #c8442f; --ok: #2f8f4e; --ferie: #d6303f; --ferie-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f191c; --panel: #172428; --fg: #e8f0f0; --muted: #96a8ad; --line: #26373c;
      --accent: #3cc0c6; --on-accent: #062a2d; --track: #243439; --we: #1b2b2f;
      --sun: #f5b62e; --crit: #ef7a66; --ok: #5fc27f; --ferie: #d6303f; --ferie-fg: #ffffff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 52px max(16px, env(safe-area-inset-right, 0px)) calc(80px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  main[inert] { opacity: .55; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }

  .entete { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
  .entnav { display: flex; align-items: center; gap: 8px; }
  .salut { margin: 0; color: var(--muted); font-size: .95rem; }
  h1 { margin: 0; font-size: 1.6rem; line-height: 1.1; letter-spacing: -.02em; font-weight: 800; }
  .rond { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; flex: none; }
  .alerte-stock { background: #fdecd0; color: #7a4a00; border-radius: 12px; padding: 10px 12px; font-size: .9rem; }

  .periode { display: flex; align-items: center; gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 2px; }
  .periode .lib { font-weight: 700; text-align: center; font-size: .95rem; padding: 0 2px; }
  .periode .petit { width: 34px; height: 36px; }
  .periode svg.i { width: 18px; height: 18px; }
  .petit { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .petit:active { background: var(--track); }

  .hero { position: relative; overflow: hidden; border-radius: 18px; padding: 12px 16px; color: #fff;
    background: linear-gradient(135deg, #0a6370 0%, #0f8088 55%, #1b9a8f 100%); }
  .hero.enconges { background: linear-gradient(135deg, #b4560f 0%, #d9801a 55%, #e6a02a 100%); }
  .hero .soleil { position: absolute; right: -4px; top: 50%; transform: translateY(-50%); width: 84px; height: 84px; opacity: .22; stroke: #fff; stroke-width: 1.4; fill: none; stroke-linecap: round; }
  .hero .etiq { position: relative; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; opacity: .92; }
  .hero .gros { position: relative; font-size: 1.4rem; font-weight: 800; line-height: 1.15; margin: 2px 0 2px; letter-spacing: -.01em; }
  .hero .det { position: relative; font-size: .82rem; opacity: .97; }

  .cpts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cpt { display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 9px; min-width: 0; }
  .anneau { position: relative; width: 50px; height: 50px; flex: none; }
  .anneau svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .anneau .centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .anneau .centre b { font-size: 1rem; font-weight: 800; }
  .anneau .centre small { color: var(--muted); font-size: .5rem; margin-top: 1px; }
  .cpt .corps { min-width: 0; flex: 1; }
  .cpt h3 { margin: 0; font-size: .8rem; line-height: 1.2; overflow-wrap: anywhere; }
  .pt { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .cpt .reste { margin: 2px 0 0; font-size: .74rem; color: var(--muted); line-height: 1.25; }
  .cpt.cet { border-color: var(--c); background: var(--panel); background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
  .cpt.cet h3 { color: var(--c); color: color-mix(in srgb, var(--c) 78%, #000); }
  @media (prefers-color-scheme: dark) { .cpt.cet h3 { color: var(--c); color: color-mix(in srgb, var(--c) 65%, #fff); } }
  .cpt .pris { margin: 1px 0 0; font-size: .74rem; line-height: 1.25; color: #b4560f; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .cpt .pris { color: #f2a65a; } }
  .cpt .prevu, .cpt .vcet { margin: 1px 0 0; font-size: .74rem; font-weight: 700; line-height: 1.25; }
  .cpt .prevu { color: var(--accent); }
  .cpt .vcet { color: var(--c); color: color-mix(in srgb, var(--c) 78%, #000); }
  @media (prefers-color-scheme: dark) { .cpt .vcet { color: var(--c); color: color-mix(in srgb, var(--c) 65%, #fff); } }
  .liens .lien { font-size: .86rem; padding: 4px 0; text-align: center; }
  @media (max-width: 340px) { .cpt { gap: 6px; padding: 8px; } .anneau { width: 42px; height: 42px; } .anneau .centre b { font-size: .9rem; } .anneau .centre small { display: none; } .cpt h3 { font-size: .74rem; } }
  .liens { grid-column: 1 / -1; display: flex; justify-content: center; flex-wrap: wrap; gap: 0 16px; }
  .cpt .reste.neg { color: var(--crit); font-weight: 700; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 14px; min-width: 0; }
  /* Le calendrier a toujours le même bleu turquoise que le panneau principal (même en mode sombre du téléphone). */
  #calendrier { background: linear-gradient(135deg, #0a6370 0%, #0f8088 55%, #1b9a8f 100%); border-color: transparent;
    --fg: #fff; --muted: rgba(255, 255, 255, .86); --line: transparent; --accent: #0e7c86; --we: #fff; --ferie: #f0b4b4; --ferie-fg: #5e1e26; --sun: #f0a202;
    color: #fff; color-scheme: light; }
  #calendrier .petit { color: #fff; }
  #calendrier .petit:active { background: rgba(255, 255, 255, .18); }
  .panel h2, .liste h2 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 800; }
  .calhaut { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .calhaut .mois { font-weight: 800; font-size: 1.05rem; text-transform: capitalize; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .sem { font-size: .7rem; color: var(--muted); text-align: center; font-weight: 800; padding: 2px 0 2px; text-transform: uppercase; }
  .jour { aspect-ratio: 1.25; width: 100%; max-width: 64px; justify-self: center; border: 0; border-radius: 12px; background: transparent; color: var(--fg); font-size: .92rem; font-weight: 600;
    position: relative; cursor: pointer; padding: 0; display: grid; place-items: center; min-width: 0; }
  /* Couleur « lumineuse » de chaque compteur sur le turquoise (repli si le téléphone ne sait pas la calculer). */
  .jour, .legende .pl { --cv: color-mix(in srgb, var(--c) 45%, #fff); --cv2: color-mix(in srgb, var(--c2) 45%, #fff); }
  @supports (color: oklch(from red l c h)) {
    .jour, .legende .pl { --cv: oklch(from var(--c) .85 clamp(.07, c, .17) h); --cv2: oklch(from var(--c2) .85 clamp(.07, c, .17) h); }
  }
  .jour.we { color: #0d1b1f; background: var(--we); font-weight: 700; }
  .jour.auj { font-weight: 800; }
  .jour.conge { background: var(--cv); color: #14232a; font-weight: 800; box-shadow: inset 0 0 0 2px #fff; }
  .jour.demi { background: linear-gradient(135deg, var(--cv) 0 50%, rgba(255, 255, 255, .2) 50% 100%); color: #fff; font-weight: 800; text-shadow: 0 0 3px rgba(0, 0, 0, .6); box-shadow: inset 0 0 0 2px #fff; }
  .jour.plage { background: color-mix(in srgb, var(--cv) 50%, #fff); color: #14232a; font-weight: 800; box-shadow: inset 0 0 0 2px var(--cv); }
  .jour.mixte { background: linear-gradient(135deg, var(--cv) 0 50%, var(--cv2) 50% 100%); color: #14232a; font-weight: 800; box-shadow: inset 0 0 0 2px #fff; }
  .jour.ferie { background: var(--ferie); color: var(--ferie-fg); font-weight: 800; }
  .jour.ferie.plage { box-shadow: inset 0 -5px 0 var(--cv); }
  /* « Aujourd'hui » : double anneau blanc + bleu nuit, visible sur toutes les tuiles. */
  #calendrier .jour.auj { box-shadow: inset 0 0 0 2.5px #fff, inset 0 0 0 4.5px #0b3f47; }
  #calendrier .jour.ferie.plage.auj { box-shadow: inset 0 0 0 2.5px #fff, inset 0 0 0 4.5px #0b3f47, inset 0 -5px 0 var(--cv); }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .8rem; color: var(--muted); }
  .legende span { display: inline-flex; align-items: center; gap: 6px; }
  .selbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; background: #fff; color: #1d2b33; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; font-size: .88rem; }
  .selbar button { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .82rem; font-weight: 700; background: var(--accent); color: #fff; cursor: pointer; }
  .selbar button.sans { background: transparent; color: #4b5a63; text-decoration: underline; padding: 6px 4px; }
  .selbar .bts { display: flex; align-items: center; gap: 6px; }
  #calendrier .jour.sel { background: var(--sun); color: #14232a; font-weight: 800; box-shadow: inset 0 0 0 2px #fff; text-shadow: none; }
  .astuce { margin: 8px 0 0; font-size: .8rem; color: var(--muted); }
  .legende .pf { width: 13px; height: 13px; border-radius: 4px; background: var(--ferie); }
  .legende .pl { background: var(--cv); box-shadow: 0 0 0 1.5px #fff; }

  .liste { display: grid; gap: 8px; }
  .liste h2 { margin: 6px 2px 0; }
  .bloc summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 12px 16px; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .bloc summary::-webkit-details-marker { display: none; }
  .bloc summary::after { content: ""; flex: none; width: 9px; height: 9px; margin: 0 2px 3px 2px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(45deg); transition: transform .2s; }
  .bloc[open] summary::after { transform: rotate(-135deg); margin-bottom: -3px; }
  .bloc .bt { font-size: .84rem; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--fg); }
  .bloc .br { margin-left: auto; font-size: .92rem; font-weight: 700; color: var(--muted); }
  .bloc .bcorps { display: grid; gap: 8px; margin-top: 8px; }
  .ligne { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 12px 14px 12px 0; cursor: pointer; min-height: 64px; overflow: hidden; }
  .ligne .barre { align-self: stretch; width: 7px; background: var(--c); flex: none; margin-right: 2px; }
  .ligne .txt { flex: 1; min-width: 0; }
  .ligne .quand { font-weight: 800; }
  .ligne .qui { font-size: .86rem; color: var(--muted); overflow-wrap: anywhere; }
  .ligne .nb { font-weight: 800; color: var(--fg); text-align: right; flex: none; white-space: nowrap; }
  .ligne.passe { opacity: .72; }
  .vide { text-align: center; color: var(--muted); padding: 22px 12px; background: var(--panel); border: 1px dashed var(--line); border-radius: 20px; }
  .vide svg { width: 44px; height: 44px; color: var(--sun); }
  .vide p { margin: 6px 0 0; }
  .pied { margin: 4px 6px 0; text-align: center; font-size: .82rem; color: var(--muted); }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    height: 44px; padding: 0 18px; border: 0; border-radius: 99px; background: var(--accent); color: var(--on-accent);
    font-weight: 700; font-size: .92rem; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 10px -5px rgba(10, 70, 78, .5); }
  .fab svg.i { width: 17px; height: 17px; }
  @media (prefers-color-scheme: dark) { .fab { background: #1b6a72; color: #e6f5f5; box-shadow: 0 3px 10px -5px rgba(0, 0, 0, .7); } }
  .fab:active { transform: translateX(-50%) scale(.97); }

  .voile { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 24, .52); display: flex; align-items: flex-end; justify-content: center; }
  .voile[hidden] { display: none; }
  .feuille { width: 100%; max-width: 520px; max-height: 92vh; max-height: 92dvh; overflow: auto; background: var(--panel); color: var(--fg);
    border-radius: 26px 26px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px)); animation: monte .22s ease-out; }
  @keyframes monte { from { transform: translateY(30px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .feuille { animation: none; } }
  @media (min-width: 700px) { .voile { align-items: center; } .feuille { border-radius: 26px; } }
  .fhaut { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .fhaut h2 { margin: 0; font-size: 1.3rem; letter-spacing: -.01em; }
  .champ { display: grid; gap: 6px; margin: 0 0 14px; min-width: 0; }
  .champ > span, .titrechamp { font-size: .8rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .champ input, .champ select { width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; padding: 0 12px; min-width: 0; }
  .champ input[type=date] { padding-right: 8px; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .puce { border: 1.5px solid var(--line); background: var(--panel); border-radius: 99px; min-height: 44px; padding: 0 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .puce[aria-pressed="true"] { border-color: var(--c); background: var(--ct); }
  .puce small { font-size: .8rem; font-weight: 600; color: var(--muted); }
  .coche { display: flex; align-items: center; gap: 12px; min-height: 44px; margin: 0 0 4px; cursor: pointer; }
  .coche input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .resume { background: var(--bg); border-radius: 16px; padding: 12px 14px; margin: 10px 0 14px; min-height: 76px; }
  .resume .grand { font-size: 1.5rem; font-weight: 800; line-height: 1.15; }
  .resume .sous { font-size: .9rem; color: var(--muted); margin-top: 2px; }
  .resume .mal { color: var(--crit); font-weight: 700; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { min-height: 50px; border-radius: 14px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 800; padding: 0 20px; cursor: pointer; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sec { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
  .btn.danger { background: transparent; color: var(--crit); border: 1.5px solid var(--crit); }
  .btn.danger.sur { background: var(--crit); color: #fff; }
  .section { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; }
  .section > h3 { margin: 0 0 10px; font-size: 1rem; }
  .carte { border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 12px; background: var(--bg); }
  .carte .champ { margin-bottom: 10px; }
  .carte .champ input { background: var(--panel); }
  .pas { display: flex; align-items: center; gap: 14px; }
  .pas button { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
  .pas button:disabled { opacity: .35; cursor: not-allowed; }
  .pas b { min-width: 84px; text-align: center; font-size: 1.3rem; }
  .vlig { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .vlig .vnom { min-width: 0; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .vlig small { font-weight: 600; color: var(--muted); }
  .vsaisie { display: flex; align-items: center; gap: 8px; flex: none; }
  .vsaisie input { width: 76px; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; text-align: center; }
  .bnom { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-weight: 800; margin-bottom: 10px; }
  .bnom small { font-weight: 600; color: var(--muted); }
  .breste { font-size: .9rem; color: var(--muted); margin: 0; }
  .breste b { color: var(--fg); }
  .breste.mal { color: var(--crit); font-weight: 700; }
  .couleurs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .couleur { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; background: var(--c); cursor: pointer; position: relative; }
  .couleur[aria-pressed="true"] { border-color: var(--panel); box-shadow: 0 0 0 3px var(--c); }
  .lien { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; cursor: pointer; text-align: left; }
  .info { background: #e3f4ee; color: #14463b; border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; font-size: .95rem; }
  @media (prefers-color-scheme: dark) { .info { background: #163a37; color: #cdeee6; } .alerte-stock { background: #4a3611; color: #fbe3b0; } }
  .msg { min-height: 1.3em; font-size: .9rem; margin: 8px 0 0; }
  .msg.mal { color: var(--crit); font-weight: 700; }
  @media print { .fab, .rond, .petit { display: none !important; } }
</style>
</head>
<body>
<main id="app">
  <header class="entete">
    <div>
      <p class="salut" id="salut"></p>
      <h1>Mes congés</h1>
    </div>
    <div class="entnav">
      <nav class="periode" aria-label="Année de congés">
        <button type="button" class="petit" id="perPrec" aria-label="Année précédente"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="lib" id="perLib" aria-live="polite"></div>
        <button type="button" class="petit" id="perSuiv" aria-label="Année suivante"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </nav>
      <button type="button" class="rond" id="btnReglages" aria-label="Réglages">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>
  <div id="stockage" class="alerte-stock" hidden>Ce navigateur n'enregistre pas les données : elles seront perdues quand tu fermeras la page. Ouvre l'appli dans Chrome pour qu'elle garde tout.</div>
  <section id="hero" aria-label="Prochain congé"></section>
  <section class="cpts" id="compteurs" aria-label="Mes compteurs"></section>
  <section class="panel" id="calendrier" aria-label="Calendrier"></section>
  <section class="liste" id="liste" aria-label="Liste des congés"></section>
  <p class="pied">Tes données restent sur cet appareil, rien n'est envoyé en ligne. Pense à faire une sauvegarde de temps en temps (Réglages).</p>
</main>
<button type="button" class="fab" id="fab">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Poser des congés
</button>
<div class="voile" id="voile" hidden>
  <div class="feuille" id="feuille" role="dialog" aria-modal="true" aria-labelledby="fTitre"></div>
</div>
<noscript><p style="padding:16px">Cette appli a besoin de JavaScript.</p></noscript>

<script>
(function () {
