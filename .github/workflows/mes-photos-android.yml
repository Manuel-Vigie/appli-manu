name: Mes Photos (APK Android)

# Se lance seulement quand le dossier mes-photos-android change : les autres applis ne sont pas concernées.
on:
  push:
    branches: [main]
    paths:
      - "mes-photos-android/**"
      - ".github/workflows/mes-photos-android.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mes-photos-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du moteur de classement
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee /tmp/gradle.log
          exit "${PIPESTATUS[0]}"

      # En cas d'échec : écrit les erreurs de compilation et les tests ratés en clair dans les annotations du lancement.
      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:|FAILED' /tmp/gradle.log | head -20 | sed 's/^/::error title=Erreur de compilation::/' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or '')[:300].replace('\n', ' ')
                      print(f"::error title=Test échoué::{tc.get('classname')}.{tc.get('name')} : {msg}")
          PY

      - name: Compiler l'APK
        run: ./gradlew assembleRelease

      - name: Préparer l'APK
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk MesPhotos.apk
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MesPhotos-apk
          path: mes-photos-android/MesPhotos.apk

      # L'APK est publié dans « Releases » : lien de téléchargement permanent, utilisable depuis le téléphone.
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mes-photos-v${{ steps.apk.outputs.version }}
          name: Mes Photos ${{ steps.apk.outputs.version }}
          body: |
            Appli Android simple : range les photos et vidéos de la carte SD par date, et les montre.
            Téléchargez MesPhotos.apk sur le téléphone, ouvrez-le et autorisez l'installation depuis cette source.
            Une nouvelle version s'installe par-dessus l'ancienne.
          files: mes-photos-android/MesPhotos.apk
