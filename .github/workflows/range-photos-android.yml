name: Range Photos (APK Android)

# Se lance seulement quand le dossier range-photos-android change : les autres applis ne sont pas concernées.
on:
  push:
    branches: [main]
    paths:
      - "range-photos-android/**"
      - ".github/workflows/range-photos-android.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: range-photos-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du moteur de classement
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      - name: Compiler l'APK
        run: ./gradlew assembleRelease

      - name: Préparer l'APK
        id: apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk RangePhotos.apk
          echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RangePhotos-apk
          path: range-photos-android/RangePhotos.apk

      # L'APK est publié dans « Releases » : lien de téléchargement permanent, utilisable depuis le téléphone.
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: range-photos-v${{ steps.apk.outputs.version }}
          name: Range Photos ${{ steps.apk.outputs.version }}
          body: |
            Appli Android qui range les photos de la carte SD en dossiers.
            Téléchargez RangePhotos.apk sur le téléphone, ouvrez-le et autorisez l'installation depuis cette source.
            Une nouvelle version s'installe par-dessus l'ancienne.
          files: range-photos-android/RangePhotos.apk
