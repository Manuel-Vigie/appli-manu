<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Santé</title>
<link rel="manifest" href="carnet-sante-manifest.webmanifest">
<meta name="theme-color" content="#1a3c6e">
<link rel="icon" type="image/png" href="carnet-sante-icon-192.png">
<link rel="apple-touch-icon" href="carnet-sante-apple-touch-icon.png">
<style>
  :root{ --bleu:#1a3c6e; --fond:#f4f6f9; --texte:#1c2530; --carte:#fff; --doux:#5b6878; --rouge:#b3261e; --ligne:#d9dfe7; }
  @media (prefers-color-scheme: dark){
    :root{ --fond:#10151c; --texte:#e8edf3; --carte:#18202a; --doux:#9aa7b6; --ligne:#2a3542; --bleu:#6b95d6; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--fond); color:var(--texte);
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main{ min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)); }
  .carte{ width:100%; max-width:440px; background:var(--carte); border:1px solid var(--ligne);
    border-radius:20px; padding:28px 24px; text-align:center; }
  .logo{ width:72px; height:72px; margin:0 auto 12px; border-radius:18px; display:block; }
  h1{ font-size:1.5rem; margin:0 0 6px; }
  p{ margin:10px 0; color:var(--doux); }
  .gros{ display:block; width:100%; margin:18px 0 0; padding:16px; border:0; border-radius:14px;
    background:#1a3c6e; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .gros.secondaire{ background:transparent; color:var(--bleu); border:2px solid var(--bleu); margin-top:12px; }
  .gros.danger{ background:transparent; color:var(--rouge); border:2px solid var(--rouge); margin-top:12px; }
  .erreur{ color:var(--rouge); font-weight:600; }
  .petit{ font-size:.85rem; }
  input[type=file]{ display:none; }
  #cadre{ position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #reglages{ position:fixed; left:max(8px,env(safe-area-inset-left)); bottom:max(8px,env(safe-area-inset-bottom));
    width:36px; height:36px; border-radius:50%; border:1px solid var(--ligne); background:var(--carte);
    color:var(--doux); font-size:18px; line-height:1; opacity:.55; z-index:5; cursor:pointer; }
  .coche{ display:flex; align-items:center; gap:12px; margin:16px 0 0; text-align:left; color:var(--texte);
    font-size:.95rem; cursor:pointer; }
  .coche input{ width:26px; height:26px; flex:none; accent-color:var(--bleu); }
  /* recadrage des photos */
  #scan{ position:fixed; inset:0; z-index:2147483002; display:flex; flex-direction:column; gap:8px;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    background:#0b0f14; color:#fff; font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none; overscroll-behavior:contain; }
  .scan-haut{ display:flex; justify-content:space-between; align-items:baseline; font-size:17px; }
  #scan-compte{ color:#9fb0c3; font-size:14px; }
  #scan .scan-aide{ margin:0; color:#c3cfdb; font-size:14px; min-height:20px; }
  .scan-zone{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #scan-canvas{ display:block; touch-action:none; background:#000; border-radius:4px; }
  .scan-barre{ display:flex; flex-direction:column; gap:8px; }
  .scan-ligne{ display:flex; gap:8px; }
  .scan-b{ flex:1; min-height:50px; padding:8px 6px; border-radius:12px; border:1px solid #3a4a5c; background:#1a2430;
    color:#fff; font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; cursor:pointer; }
  .scan-b.p{ background:#2f6fd0; border-color:#2f6fd0; }
  .scan-b.sel{ background:#fff; color:#0b0f14; border-color:#fff; }
  #scan.occ .scan-barre{ opacity:.45; pointer-events:none; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<main id="accueil" hidden>
  <div class="carte">
    <img class="logo" src="carnet-sante-icon-192.png" alt="">
    <h1>Carnet de Santé</h1>
    <div id="vue-import">
      <p>Choisissez votre fichier <b>carnet-sante.html</b> (dans le dossier Téléchargements).</p>
      <p class="petit">Il reste <b>uniquement sur ce téléphone</b>. Il n'est envoyé nulle part. Vous ne le ferez qu'une fois.</p>
      <label class="gros" for="fichier">Choisir mon fichier</label>
      <input type="file" id="fichier" accept=".html,.htm,text/html">
      <p class="erreur" id="erreur" role="alert" hidden></p>
    </div>
    <div id="vue-reglages" hidden>
      <p>Votre carnet est enregistré sur ce téléphone.</p>
      <p class="petit" id="info"></p>
      <label class="coche"><input type="checkbox" id="scan-actif"><span>Recadrer et améliorer mes photos avant de les ajouter (ordonnances, analyses…)</span></label>
      <button class="gros" id="retour" type="button">Retour à mon carnet</button>
      <label class="gros secondaire" for="fichier2">Remplacer par un nouveau fichier</label>
      <input type="file" id="fichier2" accept=".html,.htm,text/html">
      <button class="gros danger" id="effacer" type="button">Effacer mes données de ce téléphone</button>
      <p class="erreur" id="erreur2" role="alert" hidden></p>
    </div>
    <button class="gros secondaire" id="installer" type="button" hidden>Installer l'application</button>
  </div>
</main>

<iframe id="cadre" title="Mon carnet de santé" hidden></iframe>
<button id="reglages" type="button" aria-label="Réglages" hidden>⚙</button>

<div id="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scan-titre">
  <div class="scan-haut"><b id="scan-titre">Recadrer la photo</b><span id="scan-compte"></span></div>
  <p class="scan-aide" id="scan-aide" role="status"></p>
  <div class="scan-zone" id="scan-zone"><canvas id="scan-canvas"></canvas></div>
  <div class="scan-barre" id="scan-e1">
    <div class="scan-ligne">
      <button type="button" class="scan-b" id="scan-tourner">↻ Tourner</button>
      <button type="button" class="scan-b" id="scan-auto">Détecter la feuille</button>
    </div>
    <div class="scan-ligne">
      <button type="button" class="scan-b" id="scan-annuler">Annuler</button>
      <button type="button" class="scan-b" id="scan-origine">Sans retouche</button>
      <button type="button" class="scan-b p" id="scan-suite">Suivant ›</button>
    </div>
  </div>
  <div class="scan-barre" id="scan-e2" hidden>
    <div class="scan-ligne">
      <button type="button" class="scan-b sel" data-f="document">Document</button>
      <button type="button" class="scan-b" data-f="couleur">Couleur</button>
      <button type="button" class="scan-b" data-f="original">Original</button>
    </div>
    <div class="scan-ligne">
      <button type="button" class="scan-b" id="scan-retour">‹ Retour</button>
      <button type="button" class="scan-b p" id="scan-valider">Valider ✓</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var BASE = "carnet-sante-coffre", MAGASIN = "k", CLE = "fichier";
  var urlCadre = null, invit = null;

  /* --- petit coffre dans le navigateur (IndexedDB) --- */
  function ouvrirBase(){
    return new Promise(function(ok, ko){
      var r = indexedDB.open(BASE, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(MAGASIN); };
      r.onsuccess = function(){ ok(r.result); };
      r.onerror = function(){ ko(r.error); };
    });
  }
  function acces(mode, f){
    return ouvrirBase().then(function(db){
      return new Promise(function(ok, ko){
        var t = db.transaction(MAGASIN, mode), s = t.objectStore(MAGASIN), r = f(s);
        t.oncomplete = function(){ db.close(); ok(r && r.result); };
        t.onerror = t.onabort = function(){ db.close(); ko(t.error); };
      });
    });
  }
  function lire(){ return acces("readonly", function(s){ return s.get(CLE); }); }
  function ecrire(v){ return acces("readwrite", function(s){ return s.put(v, CLE); }); }
  function supprimer(){ return acces("readwrite", function(s){ return s.delete(CLE); }); }

  /* --- affichage --- */
  function montrer(vue){
    $("accueil").hidden = (vue === "carnet");
    $("cadre").hidden = (vue !== "carnet");
    $("reglages").hidden = (vue !== "carnet");
    $("vue-import").hidden = (vue !== "import");
    $("vue-reglages").hidden = (vue !== "reglages");
    $("installer").hidden = !invit || vue === "carnet";
  }
  function ouvrir(donnees){
    if (urlCadre) URL.revokeObjectURL(urlCadre);
    urlCadre = URL.createObjectURL(new Blob([donnees.html], {type: "text/html"}));
    $("cadre").src = urlCadre;
    montrer("carnet");
  }
  function erreur(id, msg){ var e = $(id); e.textContent = msg; e.hidden = !msg; }

  function importer(fichier, idErreur){
    erreur(idErreur, "");
    if (!fichier) return;
    fichier.text().then(function(txt){
      if (!/<title>\s*Carnet de Sant/i.test(txt)){
        erreur(idErreur, "Ce fichier n'est pas votre carnet de santé. Choisissez carnet-sante.html.");
        return;
      }
      var donnees = {html: txt, nom: fichier.name, taille: fichier.size, date: new Date().toISOString()};
      return ecrire(donnees).then(function(){ ouvrir(donnees); });
    }).catch(function(){
      erreur(idErreur, "Impossible d'enregistrer le fichier sur ce téléphone (stockage refusé ou plein).");
    });
  }

  $("fichier").addEventListener("change", function(e){ importer(e.target.files[0], "erreur"); e.target.value = ""; });
  $("fichier2").addEventListener("change", function(e){ importer(e.target.files[0], "erreur2"); e.target.value = ""; });

  $("reglages").addEventListener("click", function(){
    lire().then(function(d){
      $("info").textContent = d ? ("Fichier : " + d.nom + " — " + Math.round(d.taille/1024/102.4)/10 + " Mo — ajouté le " +
        new Date(d.date).toLocaleDateString("fr-FR")) : "";
      montrer("reglages");
    });
  });
  $("retour").addEventListener("click", function(){ montrer("carnet"); });

  $("effacer").addEventListener("click", function(){
    if (!confirm("Effacer votre carnet de ce téléphone ?\n\nLe fichier et les scans ajoutés ici seront supprimés. Votre fichier dans Téléchargements n'est pas touché.")) return;
    supprimer().then(function(){
      try {
        Object.keys(localStorage).forEach(function(k){
          if (/^(imagerie|analyses|ordonnances)/.test(k)) localStorage.removeItem(k);
        });
      } catch(e){}
      $("cadre").removeAttribute("src");
      montrer("import");
    });
  });

  /* --- installation --- */
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); invit = e;
    if (!$("accueil").hidden) $("installer").hidden = false;
  });
  $("installer").addEventListener("click", function(){
    if (!invit) return;
    invit.prompt(); invit = null; $("installer").hidden = true;
  });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    addEventListener("load", function(){ navigator.serviceWorker.register("carnet-sante-sw.js").catch(function(){}); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

  /* --- démarrage --- */
  lire().then(function(d){ if (d && d.html) ouvrir(d); else montrer("import"); })
        .catch(function(){ montrer("import"); });
})();
</script>

<script>
/* --- Recadrage et amélioration des photos (ordonnances, analyses…) ---
   Chaque photo ajoutée dans le carnet passe d'abord ici : recadrage sur les 4 coins, redressement,
   aspect « document ». Tout se passe sur le téléphone, rien n'est envoyé. Réglage dans ⚙. */
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var CLE = "carnet-sante-scan-actif", MAX_TRAVAIL = 3000, MAX_SORTIE = 1800, QUALITE = 0.85;
  var S = null;   /* photo en cours de retouche */

  function actif(){ try { return localStorage.getItem(CLE) !== "0"; } catch(e){ return true; } }

  /* ===== 1. On se place devant les choix de fichier faits dans le carnet ===== */
  function accrocher(el){
    if (el.__scanAcc) return;
    el.__scanAcc = true;
    el.addEventListener("input", intercepter, true);
    el.addEventListener("change", intercepter, true);
  }
  function brancher(){
    var doc, W;
    try { doc = $("cadre").contentDocument; W = doc && doc.defaultView; } catch(e){ return; }
    if (!doc || !W || doc.__scanBranche) return;
    doc.__scanBranche = true;
    doc.addEventListener("input", intercepter, true);
    doc.addEventListener("change", intercepter, true);
    try {   /* champs créés « à la volée » par le carnet (hors de la page) */
      var P = W.HTMLInputElement.prototype, clic = P.click, choisir = P.showPicker;
      P.click = function(){ if (this.type === "file") accrocher(this); return clic.apply(this, arguments); };
      if (choisir) P.showPicker = function(){ if (this.type === "file") accrocher(this); return choisir.apply(this, arguments); };
    } catch(e){}
  }
  $("cadre").addEventListener("load", brancher);

  function intercepter(e){
    var el = e.target;
    if (!el || el.tagName !== "INPUT" || el.type !== "file" || el.__scanPasse || !actif()) return;
    var liste = Array.prototype.slice.call(el.files || []), i;
    if (!liste.length) return;
    for (i = 0; i < liste.length; i++){
      if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(liste[i].type)) return;   /* ZIP, sauvegarde… : on laisse passer */
    }
    e.stopImmediatePropagation();
    if (el.__scanOccupe) return;
    el.__scanOccupe = true;
    traiterListe(liste).then(null, function(){ return liste; }).then(function(res){
      el.__scanOccupe = false;
      if (!res){ try { el.value = ""; } catch(_){} return; }   /* Annuler */
      renvoyer(el, res);
    });
  }

  function renvoyer(el, res){
    var W = el.ownerDocument.defaultView;
    try {
      var dt = new W.DataTransfer();
      res.forEach(function(r){
        dt.items.add(r && r.blob ? new W.File([r.blob], r.nom, {type: "image/jpeg", lastModified: Date.now()}) : r);
      });
      el.files = dt.files;
    } catch(e){}
    el.__scanPasse = true;
    try {
      el.dispatchEvent(new W.Event("input", {bubbles: true}));
      el.dispatchEvent(new W.Event("change", {bubbles: true}));
    } finally { el.__scanPasse = false; }
  }

  function traiterListe(liste){
    var sortie = [], i = 0, n = liste.length;
    function suite(){
      if (i >= n) return Promise.resolve(sortie);
      var f = liste[i++];
      return editer(f, i, n).then(null, function(){ return f; }).then(function(r){
        if (r === null) return null;
        sortie.push(r);
        return suite();
      });
    }
    return suite();
  }

  /* ===== 2. L'écran de retouche ===== */
  function editer(f, rang, total){
    return decoder(f).then(function(base){
      return new Promise(function(fini){
        S = {fichier: f, base: base, pts: detecter(base) || cadreParDefaut(base), etape: 1, drag: -1, k: 1,
             filtre: "document", redr: null, cache: {}, affiche: null, fini: fini};
        $("scan-compte").textContent = total > 1 ? ("Photo " + rang + " sur " + total) : "";
        $("scan").classList.remove("occ");
        $("scan").hidden = false;
        etape(1);
      });
    });
  }
  function finir(res){
    var s = S; if (!s) return;
    S = null;
    $("scan").hidden = true;
    try {
      s.base.width = 1;
      if (s.redr) s.redr.width = 1;
      Object.keys(s.cache).forEach(function(k){ s.cache[k].width = 1; });
    } catch(e){}
    s.fini(res);
  }
  function etape(n){
    S.etape = n;
    $("scan-e1").hidden = (n !== 1);
    $("scan-e2").hidden = (n !== 2);
    $("scan-titre").textContent = n === 1 ? "Recadrer la photo" : "Améliorer la photo";
    $("scan-aide").textContent = n === 1 ? "Glissez les 4 coins sur les bords de la feuille."
                                         : "Choisissez l'aspect le plus lisible, puis validez.";
    requestAnimationFrame(dessiner);
  }
  function occupe(oui){
    if (!S) return;
    $("scan").classList.toggle("occ", oui);
    if (oui) $("scan-aide").textContent = "Un instant…";
    else $("scan-aide").textContent = S.etape === 1 ? "Glissez les 4 coins sur les bords de la feuille."
                                                    : "Choisissez l'aspect le plus lisible, puis validez.";
  }
  function montrerFiltre(nom){
    S.filtre = nom;
    Array.prototype.forEach.call(document.querySelectorAll("#scan-e2 [data-f]"), function(b){
      b.classList.toggle("sel", b.getAttribute("data-f") === nom);
    });
    if (!S.cache[nom]) S.cache[nom] = (nom === "original") ? S.redr : amelio(S.redr, nom);
    S.affiche = S.cache[nom];
    dessiner();
  }

  /* boutons */
  $("scan-annuler").addEventListener("click", function(){ finir(null); });
  $("scan-origine").addEventListener("click", function(){ if (S) finir(S.fichier); });
  $("scan-tourner").addEventListener("click", function(){
    if (!S) return;
    var b = S.base, H = b.height, c = document.createElement("canvas");
    c.width = H; c.height = b.width;
    var x = c.getContext("2d", {willReadFrequently: true});
    x.translate(H, 0); x.rotate(Math.PI / 2); x.drawImage(b, 0, 0);
    var r = S.pts.map(function(p){ return [H - p[1], p[0]]; });
    S.pts = [r[3], r[0], r[1], r[2]];
    b.width = 1; S.base = c;
    dessiner();
  });
  $("scan-auto").addEventListener("click", function(){ if (S){ S.pts = detecter(S.base) || cadreParDefaut(S.base); dessiner(); } });
  $("scan-suite").addEventListener("click", function(){
    if (!S) return;
    occupe(true);
    setTimeout(function(){
      if (!S) return;
      try {
        S.redr = redresser(S.base, S.pts);
        S.cache = {};
        occupe(false);
        etape(2);
        montrerFiltre(S.filtre);
      } catch(e){ finir(S && S.fichier); }
    }, 40);
  });
  $("scan-retour").addEventListener("click", function(){ if (S){ etape(1); } });
  Array.prototype.forEach.call(document.querySelectorAll("#scan-e2 [data-f]"), function(b){
    b.addEventListener("click", function(){
      if (!S) return;
      var nom = b.getAttribute("data-f");
      occupe(true);
      setTimeout(function(){ if (!S) return; try { montrerFiltre(nom); } finally { occupe(false); } }, 40);
    });
  });
  $("scan-valider").addEventListener("click", function(){
    if (!S || !S.affiche) return;
    var s = S;
    occupe(true);
    s.affiche.toBlob(function(blob){
      if (S !== s) return;
      if (!blob){ finir(s.fichier); return; }
      finir({blob: blob, nom: (s.fichier.name || "photo").replace(/\.[^.]*$/, "") + "-scan.jpg"});
    }, "image/jpeg", QUALITE);
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && S) finir(null); });
  window.addEventListener("resize", dessiner);

  /* réglage dans ⚙ */
  $("reglages").addEventListener("click", function(){ $("scan-actif").checked = actif(); });
  $("scan-actif").addEventListener("change", function(){
    try { localStorage.setItem(CLE, this.checked ? "1" : "0"); } catch(e){}
  });

  /* ===== 3. Dessin : photo, cadre, coins, loupe ===== */
  function dessiner(){
    if (!S) return;
    var z = $("scan-zone"), c = $("scan-canvas"), img = (S.etape === 1) ? S.base : S.affiche;
    var zw = z.clientWidth, zh = z.clientHeight;
    if (!img || !zw || !zh) return;
    var k = Math.min(zw / img.width, zh / img.height);
    var cw = Math.max(1, Math.floor(img.width * k)), ch = Math.max(1, Math.floor(img.height * k));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.style.width = cw + "px"; c.style.height = ch + "px";
    if (c.width !== Math.round(cw * dpr) || c.height !== Math.round(ch * dpr)){
      c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
    }
    var x = c.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, cw, ch);
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
    x.drawImage(img, 0, 0, cw, ch);
    S.k = cw / img.width;
    if (S.etape === 1) poignees(x, cw, ch);
  }
  function poignees(x, cw, ch){
    var p = S.pts.map(function(q){ return [q[0] * S.k, q[1] * S.k]; }), i;
    x.save();
    x.fillStyle = "rgba(0,0,0,.5)";
    x.beginPath(); x.rect(0, 0, cw, ch);
    x.moveTo(p[0][0], p[0][1]); for (i = 1; i < 4; i++) x.lineTo(p[i][0], p[i][1]);
    x.closePath(); x.fill("evenodd");
    x.strokeStyle = "#4da3ff"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(p[0][0], p[0][1]); for (i = 1; i < 4; i++) x.lineTo(p[i][0], p[i][1]);
    x.closePath(); x.stroke();
    for (i = 0; i < 4; i++){
      x.beginPath(); x.arc(p[i][0], p[i][1], S.drag === i ? 16 : 13, 0, 6.2832);
      x.fillStyle = "rgba(77,163,255,.35)"; x.fill();
      x.strokeStyle = "#fff"; x.lineWidth = 2.5; x.stroke();
    }
    if (S.drag >= 0) loupe(x, cw, p[S.drag], S.pts[S.drag]);
    x.restore();
  }
  function loupe(x, cw, pd, pb){
    var R = 52, Z = 2.5, lx = R + 8, ly = R + 8;

  /* ===== 6. Aspect « document » : on enlève les ombres, on blanchit le papier, on fonce l'encre ===== */
  /* fond du papier : plus clair de chaque bloc, puis lissage */
  function fondGrille(arr, pas, dec, w, h){

  function ouvrir(){
    var d=q(".maj-dispo");
    if(distante&&distante.version!==A.version){ d.hidden=false; d.textContent="Nouvelle version en ligne : "+distante.version+(distante.date?" du "+distante.date:"")+". Touchez Actualiser."; }
    else d.hidden=true;
    q(".maj-msg").textContent=""; p.hidden=false; verifier(true);
  }
  function fermer(){ p.hidden=true; }
  b.addEventListener("click",ouvrir);
  q(".maj-fermer").addEventListener("click",fermer);
  p.addEventListener("click",function(e){ if(e.target===p) fermer(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!p.hidden) fermer(); });

  q(".maj-ok").addEventListener("click",function(){
    var msg=q(".maj-msg");
    if(!enLigne){ msg.textContent="Cette page est un fichier ouvert sur l'appareil : ouvrez plutôt l'adresse en ligne."; return; }
    if(navigator.onLine===false){ msg.textContent="Pas de connexion internet : réessayez plus tard."; return; }
    msg.textContent="Mise à jour en cours…";
    var go=function(){ setTimeout(function(){ location.replace(location.pathname+"?maj="+Date.now()+location.hash); },300); };
    Promise.resolve().then(function(){
      if(!("serviceWorker" in navigator)) return;
      return navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); });
    }).catch(function(){}).then(function(){
      if(!("caches" in window)||!A.cache) return;
      return caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf(A.cache)===0; }).map(function(k){ return caches.delete(k); })); });
    }).catch(function(){}).then(go,go);
  });

  var dernier=0;
  function verifier(force){
    if(!enLigne||navigator.onLine===false) return;
    var t=Date.now(); if(!force&&t-dernier<5*60*1000) return; dernier=t;
    fetch("version.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(j&&j.version){ distante=j; majTexte();
        if(!p.hidden&&j.version!==A.version){ var d=q(".maj-dispo"); d.hidden=false; d.textContent="Nouvelle version en ligne : "+j.version+(j.date?" du "+j.date:"")+". Touchez Actualiser."; } }
    }).catch(function(){});
  }
  function poser(){ document.body.appendChild(b); document.body.appendChild(p); majTexte(); setTimeout(function(){ verifier(true); },1500); }
  if(document.body) poser(); else document.addEventListener("DOMContentLoaded",poser);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) verifier(false); });
})();
</script>
<!-- MAJ:fin -->
