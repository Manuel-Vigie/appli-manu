<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de Santé</title>
<link rel="manifest" href="carnet-sante-manifest.webmanifest">
<meta name="theme-color" content="#1a3c6e">
<link rel="icon" type="image/png" href="carnet-sante-icon-192.png">
<link rel="apple-touch-icon" href="carnet-sante-apple-touch-icon.png">
<style>
  :root{ --bleu:#1a3c6e; --fond:#f4f6f9; --texte:#1c2530; --carte:#fff; --doux:#5b6878; --rouge:#b3261e; --ligne:#d9dfe7; }
  @media (prefers-color-scheme: dark){
    :root{ --fond:#10151c; --texte:#e8edf3; --carte:#18202a; --doux:#9aa7b6; --ligne:#2a3542; --bleu:#6b95d6; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--fond); color:var(--texte);
    font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main{ min-height:100%; display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom)); }
  .carte{ width:100%; max-width:440px; background:var(--carte); border:1px solid var(--ligne);
    border-radius:20px; padding:28px 24px; text-align:center; }
  .logo{ width:72px; height:72px; margin:0 auto 12px; border-radius:18px; display:block; }
  h1{ font-size:1.5rem; margin:0 0 6px; }
  p{ margin:10px 0; color:var(--doux); }
  .gros{ display:block; width:100%; margin:18px 0 0; padding:16px; border:0; border-radius:14px;
    background:#1a3c6e; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .gros.secondaire{ background:transparent; color:var(--bleu); border:2px solid var(--bleu); margin-top:12px; }
  .gros.danger{ background:transparent; color:var(--rouge); border:2px solid var(--rouge); margin-top:12px; }
  .erreur{ color:var(--rouge); font-weight:600; }
  .petit{ font-size:.85rem; }
  input[type=file]{ display:none; }
  #cadre{ position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #reglages{ position:fixed; left:max(8px,env(safe-area-inset-left)); bottom:max(8px,env(safe-area-inset-bottom));
    width:36px; height:36px; border-radius:50%; border:1px solid var(--ligne); background:var(--carte);
    color:var(--doux); font-size:18px; line-height:1; opacity:.55; z-index:5; cursor:pointer; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<main id="accueil" hidden>
  <div class="carte">
    <img class="logo" src="carnet-sante-icon-192.png" alt="">
    <h1>Carnet de Santé</h1>
    <div id="vue-import">
      <p>Choisissez votre fichier <b>carnet-sante.html</b> (dans le dossier Téléchargements).</p>
      <p class="petit">Il reste <b>uniquement sur ce téléphone</b>. Il n'est envoyé nulle part. Vous ne le ferez qu'une fois.</p>
      <label class="gros" for="fichier">Choisir mon fichier</label>
      <input type="file" id="fichier" accept=".html,.htm,text/html">
      <p class="erreur" id="erreur" role="alert" hidden></p>
    </div>
    <div id="vue-reglages" hidden>
      <p>Votre carnet est enregistré sur ce téléphone.</p>
      <p class="petit" id="info"></p>
      <button class="gros" id="retour" type="button">Retour à mon carnet</button>
      <label class="gros secondaire" for="fichier2">Remplacer par un nouveau fichier</label>
      <input type="file" id="fichier2" accept=".html,.htm,text/html">
      <button class="gros danger" id="effacer" type="button">Effacer mes données de ce téléphone</button>
      <p class="erreur" id="erreur2" role="alert" hidden></p>
    </div>
    <button class="gros secondaire" id="installer" type="button" hidden>Installer l'application</button>
  </div>
</main>

<iframe id="cadre" title="Mon carnet de santé" hidden></iframe>
<button id="reglages" type="button" aria-label="Réglages" hidden>⚙</button>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var BASE = "carnet-sante-coffre", MAGASIN = "k", CLE = "fichier";
  var urlCadre = null, invit = null;

  /* --- petit coffre dans le navigateur (IndexedDB) --- */
  function ouvrirBase(){
    return new Promise(function(ok, ko){
      var r = indexedDB.open(BASE, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(MAGASIN); };
      r.onsuccess = function(){ ok(r.result); };
      r.onerror = function(){ ko(r.error); };
    });
  }
  function acces(mode, f){
    return ouvrirBase().then(function(db){
      return new Promise(function(ok, ko){
        var t = db.transaction(MAGASIN, mode), s = t.objectStore(MAGASIN), r = f(s);
        t.oncomplete = function(){ db.close(); ok(r && r.result); };
        t.onerror = t.onabort = function(){ db.close(); ko(t.error); };
      });
    });
  }
  function lire(){ return acces("readonly", function(s){ return s.get(CLE); }); }
  function ecrire(v){ return acces("readwrite", function(s){ return s.put(v, CLE); }); }
  function supprimer(){ return acces("readwrite", function(s){ return s.delete(CLE); }); }

  /* --- affichage --- */
  function montrer(vue){
    $("accueil").hidden = (vue === "carnet");
    $("cadre").hidden = (vue !== "carnet");
    $("reglages").hidden = (vue !== "carnet");
    $("vue-import").hidden = (vue !== "import");
    $("vue-reglages").hidden = (vue !== "reglages");
    $("installer").hidden = !invit || vue === "carnet";
  }
  function ouvrir(donnees){
    if (urlCadre) URL.revokeObjectURL(urlCadre);
    urlCadre = URL.createObjectURL(new Blob([donnees.html], {type: "text/html"}));
    $("cadre").src = urlCadre;
    montrer("carnet");
  }
  function erreur(id, msg){ var e = $(id); e.textContent = msg; e.hidden = !msg; }

  function importer(fichier, idErreur){
    erreur(idErreur, "");
    if (!fichier) return;
    fichier.text().then(function(txt){
      if (!/<title>\s*Carnet de Sant/i.test(txt)){
        erreur(idErreur, "Ce fichier n'est pas votre carnet de santé. Choisissez carnet-sante.html.");
        return;
      }
      var donnees = {html: txt, nom: fichier.name, taille: fichier.size, date: new Date().toISOString()};
      return ecrire(donnees).then(function(){ ouvrir(donnees); });
    }).catch(function(){
      erreur(idErreur, "Impossible d'enregistrer le fichier sur ce téléphone (stockage refusé ou plein).");
    });
  }

  $("fichier").addEventListener("change", function(e){ importer(e.target.files[0], "erreur"); e.target.value = ""; });
  $("fichier2").addEventListener("change", function(e){ importer(e.target.files[0], "erreur2"); e.target.value = ""; });

  $("reglages").addEventListener("click", function(){
    lire().then(function(d){
      $("info").textContent = d ? ("Fichier : " + d.nom + " — " + Math.round(d.taille/1024/102.4)/10 + " Mo — ajouté le " +
        new Date(d.date).toLocaleDateString("fr-FR")) : "";
      montrer("reglages");
    });
  });
  $("retour").addEventListener("click", function(){ montrer("carnet"); });

  $("effacer").addEventListener("click", function(){
    if (!confirm("Effacer votre carnet de ce téléphone ?\n\nLe fichier et les scans ajoutés ici seront supprimés. Votre fichier dans Téléchargements n'est pas touché.")) return;
    supprimer().then(function(){
      try {
        Object.keys(localStorage).forEach(function(k){
          if (/^(imagerie|analyses|ordonnances)/.test(k)) localStorage.removeItem(k);
        });
      } catch(e){}
      $("cadre").removeAttribute("src");
      montrer("import");
    });
  });

  /* --- installation --- */
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); invit = e;
    if (!$("accueil").hidden) $("installer").hidden = false;
  });
  $("installer").addEventListener("click", function(){
    if (!invit) return;
    invit.prompt(); invit = null; $("installer").hidden = true;
  });

  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    addEventListener("load", function(){ navigator.serviceWorker.register("carnet-sante-sw.js").catch(function(){}); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

  /* --- démarrage --- */
  lire().then(function(d){ if (d && d.html) ouvrir(d); else montrer("import"); })
        .catch(function(){ montrer("import"); });
})();
</script>
<!-- MAJ:debut — pastille de mise à jour commune à toutes les applis (modèle : outils/pastille-maj.html, ne pas modifier ici à la main) -->
<style>
#maj-pastille{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:2147483000;
  display:flex;align-items:center;gap:5px;margin:0;padding:5px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.25);
  background:rgba(22,30,36,.86);color:#fff;font:700 11.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;
  box-shadow:0 4px 14px -6px rgba(0,0,0,.6);cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px)}
#maj-pastille .maj-fl{font-size:13px}
#maj-pastille.maj-nouvelle{background:#1d7a45;border-color:#7fd6a3;animation:maj-pulse 2s ease-in-out infinite}
@keyframes maj-pulse{50%{box-shadow:0 0 0 5px rgba(29,122,69,.25)}}
@media (prefers-reduced-motion:reduce){#maj-pastille.maj-nouvelle{animation:none}}
#maj-panneau{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:flex-start;justify-content:center;
  padding:calc(52px + env(safe-area-inset-top,0px)) 16px 16px;background:rgba(0,0,0,.45);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#maj-panneau[hidden]{display:none}
#maj-panneau .maj-boite{width:100%;max-width:360px;max-height:100%;overflow:auto;background:#fff;color:#16202a;border-radius:14px;padding:16px 16px 14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.6)}
#maj-panneau .maj-nom{font-weight:800;font-size:18px;margin:0 0 2px}
#maj-panneau .maj-ver{color:#4b5a68;font-size:13.5px;margin:0}
#maj-panneau .maj-dispo{margin:10px 0 0;padding:8px 10px;border-radius:9px;background:#e3f4ea;color:#14532d;font-weight:600;font-size:13.5px}
#maj-panneau .maj-t{margin:12px 0 4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6a7884}
#maj-panneau ul{margin:0;padding:0 0 0 18px;font-size:13.5px;color:#26323d}
#maj-panneau li{margin:3px 0}
#maj-panneau .maj-actions{display:flex;gap:8px;margin-top:14px}
#maj-panneau button{flex:1;min-height:44px;border-radius:10px;border:1px solid #c9d2da;background:#f3f6f8;color:#16202a;font:700 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
#maj-panneau button.maj-ok{background:#1f4f7a;border-color:#1f4f7a;color:#fff}
#maj-panneau .maj-msg{margin:10px 0 0;font-size:13px;color:#8a3b12}
#maj-panneau .maj-msg:empty{display:none}
@media print{#maj-pastille,#maj-panneau{display:none!important}}
#cadre:not([hidden])~#maj-pastille{top:auto;right:auto;left:calc(52px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));opacity:.8}
</style>
<script>
window.MAJ_APPLI={"nom": "Carnet de Santé", "version": "V2", "date": "06/10/2026", "cache": "carnet-sante-app-", "nouveautes": ["Pastille de mise à jour : version, date et bouton Actualiser (en bas, à côté de ⚙, quand le carnet est ouvert).", "Coquille vide en ligne : vos données restent uniquement sur le téléphone."]};
(function(){
  "use strict";
  var A=window.MAJ_APPLI; if(!A||document.getElementById("maj-pastille")) return;
  var enLigne=/^https?:$/.test(location.protocol), distante=null;
  /* nettoie l'adresse après une actualisation (?maj=...) */
  if(/[?&]maj=/.test(location.search)){ try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){} }

  var b=document.createElement("button");
  b.type="button"; b.id="maj-pastille"; b.title=A.nom+" — version et mise à jour";
  b.innerHTML='<span class="maj-fl" aria-hidden="true">↻</span><span class="maj-txt"></span>';
  var txt=b.querySelector(".maj-txt");
  function court(d){ return String(d||"").slice(0,5); }
  function majTexte(){
    if(distante&&distante.version!==A.version){ b.classList.add("maj-nouvelle"); txt.textContent="Nouvelle version"; }
    else { b.classList.remove("maj-nouvelle"); txt.textContent=A.version+" · "+court(A.date); }
  }

  var p=document.createElement("div");
  p.id="maj-panneau"; p.hidden=true; p.setAttribute("role","dialog"); p.setAttribute("aria-modal","true"); p.setAttribute("aria-label","Mise à jour");
  p.innerHTML='<div class="maj-boite"><p class="maj-nom"></p><p class="maj-ver"></p><p class="maj-dispo" hidden></p>'+
    '<p class="maj-t">Dernières nouveautés</p><ul></ul>'+
    '<div class="maj-actions"><button type="button" class="maj-ok">↻ Actualiser</button><button type="button" class="maj-fermer">Fermer</button></div>'+
    '<p class="maj-msg" role="status"></p></div>';
  var q=function(s){ return p.querySelector(s); };
  q(".maj-nom").textContent=A.nom;
  q(".maj-ver").textContent="Version "+A.version+" · mise à jour le "+A.date;
  (A.nouveautes||[]).slice(0,4).forEach(function(n){ var li=document.createElement("li"); li.textContent=n; q("ul").appendChild(li); });

  function ouvrir(){
    var d=q(".maj-dispo");
    if(distante&&distante.version!==A.version){ d.hidden=false; d.textContent="Nouvelle version en ligne : "+distante.version+(distante.date?" du "+distante.date:"")+". Touchez Actualiser."; }
    else d.hidden=true;
    q(".maj-msg").textContent=""; p.hidden=false; verifier(true);
  }
  function fermer(){ p.hidden=true; }
  b.addEventListener("click",ouvrir);
  q(".maj-fermer").addEventListener("click",fermer);
  p.addEventListener("click",function(e){ if(e.target===p) fermer(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!p.hidden) fermer(); });

  q(".maj-ok").addEventListener("click",function(){
    var msg=q(".maj-msg");
    if(!enLigne){ msg.textContent="Cette page est un fichier ouvert sur l'appareil : ouvrez plutôt l'adresse en ligne."; return; }
    if(navigator.onLine===false){ msg.textContent="Pas de connexion internet : réessayez plus tard."; return; }
    msg.textContent="Mise à jour en cours…";
    var go=function(){ setTimeout(function(){ location.replace(location.pathname+"?maj="+Date.now()+location.hash); },300); };
    Promise.resolve().then(function(){
      if(!("serviceWorker" in navigator)) return;
      return navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.update().catch(function(){}); })); });
    }).catch(function(){}).then(function(){
      if(!("caches" in window)||!A.cache) return;
      return caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf(A.cache)===0; }).map(function(k){ return caches.delete(k); })); });
    }).catch(function(){}).then(go,go);
  });

  var dernier=0;
  function verifier(force){
    if(!enLigne||navigator.onLine===false) return;
    var t=Date.now(); if(!force&&t-dernier<5*60*1000) return; dernier=t;
    fetch("version.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
      if(j&&j.version){ distante=j; majTexte();
        if(!p.hidden&&j.version!==A.version){ var d=q(".maj-dispo"); d.hidden=false; d.textContent="Nouvelle version en ligne : "+j.version+(j.date?" du "+j.date:"")+". Touchez Actualiser."; } }
    }).catch(function(){});
  }
  function poser(){ document.body.appendChild(b); document.body.appendChild(p); majTexte(); setTimeout(function(){ verifier(true); },1500); }
  if(document.body) poser(); else document.addEventListener("DOMContentLoaded",poser);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) verifier(false); });
})();
</script>
<!-- MAJ:fin -->
</body>
</html>
