<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon chalet</title>
<link rel="manifest" href="chalet-manifest.webmanifest">
<meta name="theme-color" content="#2b1a10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="chalet-icon-192.png">
<link rel="apple-touch-icon" href="chalet-apple-touch-icon.png">
<style>
  :root {
    --bois: #2b1a10; --bois2: #3d2616; --bois3: #57361f; --trait: #6b4528;
    --creme: #f6ead2; --muted: #cdb98f;
    --rouge: #b3382c; --rouge2: #d4503f; --vert: #2f7a46; --or: #e8b04a;
    --papier: #f4e8cc; --encre: #3b2209; --ligne: #cdb27c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bois); color: var(--creme);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; list-style: none; }

  header { flex: none; padding: calc(8px + env(safe-area-inset-top, 0px)) 118px 8px max(14px, env(safe-area-inset-left, 0px)); min-height: 52px; }
  h1 { margin: 0; font: 700 23px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  #zone { flex: 1 1 0; position: relative; min-height: 0; background: #3b2616; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #charge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  #charge[hidden] { display: none; }

  #repli { position: absolute; inset: 0; overflow: auto; padding: 12px max(14px, env(safe-area-inset-left, 0px)) 16px; }
  #repli[hidden] { display: none; }
  #repli .note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  #repli .tir { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; margin: 0 0 8px; padding: 0 16px; border-radius: 14px;
    border: 1px solid var(--trait); background: var(--bois3); font: 700 18px Georgia, serif; cursor: pointer; text-align: left; }
  #repli .tir b { min-width: 28px; padding: 3px 9px; border-radius: 99px; background: var(--rouge); font: 700 14px system-ui; text-align: center; }
  #repli .tir b.fini { background: var(--vert); }

  /* le tiroir ouvert : la liste s'affiche en bas, l'armoire reste visible en haut */
  #tiroir { flex: 0 0 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--papier); color: var(--encre);
    border-radius: 20px 20px 0 0; border-top: 0 solid #6b4528; transition: flex-basis .3s ease; }
  body.ouvert #tiroir { flex-basis: 62%; border-top-width: 6px; }
  body.ouvert nav { display: none; }
  /* écran large (PC, tablette en travers) : la liste s'ouvre à droite au lieu d'en bas */
  @media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    body { display: grid; grid-template-columns: minmax(0, 1fr) 0; grid-template-rows: auto minmax(0, 1fr) auto; transition: grid-template-columns .3s ease; }
    header, nav { grid-column: 1 / -1; }
    header { grid-row: 1; }
    #zone { grid-column: 1; grid-row: 2; }
    #tiroir { grid-column: 2; grid-row: 2; width: auto; min-width: 0; border-radius: 20px 0 0 0; border-top-width: 0 !important; border-left: 0 solid #6b4528; }
    nav { grid-row: 3; }
    body.ouvert { grid-template-columns: minmax(0, 1fr) 460px; }
    body.ouvert #tiroir { border-left-width: 6px; }
  }
  .t-tete { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px 16px; }
  .t-tete h2 { flex: 1; min-width: 0; margin: 0; font: 700 22px/1.2 Georgia, "Times New Roman", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-tete button { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--ligne); background: #ecdcb5; color: var(--encre); font-size: 19px; cursor: pointer; }
  .t-corps { flex: 1; min-height: 0; overflow: auto; padding: 4px 14px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .t-ajout { display: flex; gap: 8px; margin: 4px 0 6px; }
  .t-ajout input { flex: 1; min-width: 0; min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1px solid #c9ad74; background: #fffaf0; font-size: 17px; color: var(--encre); }
  .t-ajout button { flex: none; width: 54px; min-height: 50px; border-radius: 12px; border: 0; background: var(--rouge); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; }
  .t-liste { list-style: none; margin: 0; padding: 0; }
  .t-liste li { display: flex; align-items: center; border-bottom: 1px dashed var(--ligne); }
  .ligne { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0; background: none; border: 0; text-align: left; font-size: 19px; color: var(--encre); cursor: pointer; }
  .ligne .nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .case { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #8a5a2b; display: flex; align-items: center; justify-content: center; background: #fffaf0; }
  .fait .case { background: var(--vert); border-color: var(--vert); }
  .fait .case::after { content: ""; width: 8px; height: 15px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -2px); }
  .fait .nom { text-decoration: line-through; color: #8a7a5a; }
  .t-liste .x { flex: none; width: 44px; height: 44px; border: 0; background: none; color: #9a8458; font-size: 17px; cursor: pointer; }
  .t-vide { margin: 10px 0 4px; color: #6f5b34; font-size: 15px; }
  .t-sous { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f5b34; }
  .t-sous button { min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--ligne); background: #ecdcb5; color: var(--encre); font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; cursor: pointer; }
  .grille { display: flex; flex-wrap: wrap; gap: 8px; }
  .hab { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ligne); background: #ecdcb5; color: var(--encre); font-size: 16px; cursor: pointer; }
  .hab::before { content: "＋ "; color: var(--rouge); font-weight: 700; }
  .hab.oublier::before { content: "✕ "; }
  .t-ranger { width: 100%; min-height: 52px; margin-top: 16px; border-radius: 14px; border: 0; background: var(--vert); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }

  nav { flex: none; display: flex; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    background: var(--bois2); border-top: 1px solid var(--trait); }
  nav button { min-height: 50px; min-width: 0; border-radius: 14px; border: 1px solid var(--trait); background: var(--bois3); font-weight: 600; font-size: 15px; padding: 0 14px; cursor: pointer; white-space: nowrap; }
  nav #b-liste { flex: 1; background: var(--rouge); border-color: #e0705f; font-size: 16px; }
  nav #b-liste b { display: inline-block; min-width: 26px; margin-left: 8px; padding: 3px 8px; border-radius: 99px; background: var(--creme); color: #6b1d14; font-size: 14px; }

  #voile { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,2,.62); display: flex; align-items: flex-end; justify-content: center; }
  #voile[hidden] { display: none; }
  #feuille { width: 100%; max-width: 520px; max-height: 90dvh; overflow: auto; background: var(--bois2); border: 1px solid var(--trait); border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #feuille.papier { background: var(--papier); color: var(--encre); border-color: #6b4528; }
  #feuille h2 { margin: 0 0 12px; font: 700 20px Georgia, "Times New Roman", serif; }
  #feuille label { display: block; margin: 12px 0 5px; font-size: 13.5px; color: var(--muted); }
  #feuille input[type=text] { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--trait); background: #25160d; font-size: 17px; }
  #feuille .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  #feuille .actions button { flex: 1; min-height: 50px; border-radius: 14px; border: 1px solid var(--trait); background: var(--bois3); font-weight: 600; font-size: 16px; cursor: pointer; }
  #feuille.papier .actions button { border-color: var(--ligne); background: #ecdcb5; color: var(--encre); }
  #feuille .actions .ok { background: var(--rouge); border-color: #e0705f; color: #fff; }
  #feuille .actions .vert { background: var(--vert); border-color: var(--vert); color: #fff; }
  #feuille .actions .danger { background: #2a1a1a; border-color: #8a4137; color: #ffb4a8; }
  #feuille .actions .danger.sur { background: #8c2a20; color: #fff; }
  #feuille .msg { margin: 10px 0 0; font-size: 14px; color: #ffb4a8; min-height: 1em; }
  #feuille .vide { color: var(--muted); margin: 6px 0 0; }
  #feuille.papier .vide { color: #6f5b34; }
  #feuille .rub { margin: 14px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f5b34; }
</style>
</head>
<body>
<header>
  <h1>Mon chalet</h1>
  <p>Touchez un tiroir pour voir sa liste.</p>
</header>

<div id="zone">
  <canvas id="scene" tabindex="0" role="img" aria-label="Armoire de chalet en 3D. Glissez pour parcourir, touchez un tiroir pour l'ouvrir."></canvas>
  <div id="charge">Le chalet se prépare…</div>
  <div id="repli" hidden></div>
</div>

<section id="tiroir" aria-label="Contenu du tiroir"></section>
<ul id="acces" class="sr" aria-label="Tiroirs"></ul>

<nav>
  <button type="button" id="b-nouveau">＋ Tiroir</button>
  <button type="button" id="b-liste">Ma liste<b id="n-achat">0</b></button>
</nav>

<div id="voile" hidden><div id="feuille" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, props, kids) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      if (k === 'text') e.textContent = props[k];
      else if (k === 'class') e.className = props[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  /* ============================== Données ============================== */
  /* rubriques = tiroirs. produits = articles à acheter dans ce tiroir (fait = déjà dans le panier). habitudes = noms qu'on rachète souvent. */
  var CLE = 'chalet-donnees-v2', CLE_V1 = 'chalet-donnees-v1';
  function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function defaut() {
    function r(nom, hab) { return { id: uid(), nom: nom, produits: [], habitudes: hab }; }
    return { v: 2, rubriques: [
      r('Garde-manger', ['Café', 'Pâtes', 'Riz', 'Huile', 'Sucre', 'Farine']),
      r('Frais', ['Beurre', 'Lait', 'Œufs', 'Fromage', 'Pain', 'Yaourts']),
      r('Maison', ['Savon', 'Éponges', 'Lessive', 'Essuie-tout', 'Sacs poubelle', 'Papier toilette']),
      r('Matériel', ['Ampoules', 'Piles', 'Vis', 'Gaz', 'Allumettes', 'Colle'])
    ] };
  }
  function normaliser(o) {
    o.v = 2;
    o.rubriques.forEach(function (r) {
      r.id = r.id || uid(); r.nom = String(r.nom || 'Tiroir');
      r.produits = (r.produits || []).map(function (p) { return { id: p.id || uid(), nom: String(p.nom || ''), fait: !!p.fait }; });
      r.habitudes = Array.isArray(r.habitudes) ? r.habitudes.map(String) : [];
    });
    return o;
  }
  function migrerV1(o) {   /* ancienne version (étagères) : les produits cochés « à acheter » deviennent des articles ; tous les noms deviennent des habitudes */
    var ach = o.achat || {};
    return normaliser({ rubriques: o.rubriques.map(function (r) {
      var l = r.produits || [];
      return { id: r.id, nom: r.nom, produits: l.filter(function (p) { return ach[p.id]; }).map(function (p) { return { id: p.id, nom: p.nom, fait: false }; }), habitudes: l.map(function (p) { return p.nom; }) };
    }) });
  }
  function charger() {
    try {
      var t = localStorage.getItem(CLE);
      if (t) { var o = JSON.parse(t); if (o && Array.isArray(o.rubriques)) return normaliser(o); }
      var t1 = localStorage.getItem(CLE_V1);
      if (t1) { var o1 = JSON.parse(t1); if (o1 && Array.isArray(o1.rubriques)) return migrerV1(o1); }
    } catch (e) {}
    return defaut();
  }
  var D = charger();
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(D)); } catch (e) {} }
  sauver();
  function rubParId(id) { return D.rubriques.filter(function (r) { return r.id === id; })[0] || null; }
  function reste(r) { return r.produits.filter(function (p) { return !p.fait; }).length; }
  function resteTotal() { return D.rubriques.reduce(function (n, r) { return n + reste(r); }, 0); }
  function memeNom(a, b) { return a.toLowerCase() === b.toLowerCase(); }
  function hash(s) { var x = 7; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }
  function net(s) { return String(s).replace(/\s+/g, ' ').trim(); }

  /* ============================== Actions ============================== */
  var ouvertId = null, habEdit = false;
  function vibrer() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
  function rafraichir() {
    majBarre();
    if (G.ok) G.reconstruire(); else dessinerRepli();
    if (ouvertId) majPanneau();
    if (!voile.hidden && feuille.getAttribute('data-vue') === 'liste') feuilleListe();
  }
  function ajouterArticle(r, nom) {
    nom = net(nom); if (!nom) return false;
    var ex = r.produits.filter(function (p) { return memeNom(p.nom, nom); })[0];
    if (ex) ex.fait = false; else r.produits.push({ id: uid(), nom: nom, fait: false });
    if (!r.habitudes.some(function (x) { return memeNom(x, nom); })) r.habitudes.push(nom);
    sauver(); vibrer(); rafraichir(); return true;
  }
  function basculer(rid, pid) {
    var r = rubParId(rid); if (!r) return;
    r.produits.forEach(function (p) { if (p.id === pid) p.fait = !p.fait; });
    sauver(); vibrer(); rafraichir();
  }
  function retirer(rid, pid) {
    var r = rubParId(rid); if (!r) return;
    r.produits = r.produits.filter(function (p) { return p.id !== pid; }); sauver(); rafraichir();
  }
  function rangerFaits(rid) {
    D.rubriques.forEach(function (r) { if (!rid || r.id === rid) r.produits = r.produits.filter(function (p) { return !p.fait; }); });
    sauver(); rafraichir();
  }

  /* ============================== Panneau du tiroir ouvert ============================== */
  var voile = $('#voile'), feuille = $('#feuille');
  function ligneArticle(r, p) {
    return h('li', { class: p.fait ? 'fait' : '' }, [
      h('button', { type: 'button', class: 'ligne', role: 'checkbox', 'aria-checked': p.fait ? 'true' : 'false', onclick: function () { basculer(r.id, p.id); } },
        [h('span', { class: 'case' }), h('span', { class: 'nom', text: p.nom })]),
      h('button', { type: 'button', class: 'x', 'aria-label': 'Retirer ' + p.nom, text: '✕', onclick: function () { retirer(r.id, p.id); } })
    ]);
  }
  function ouvrirTiroir(id) {
    var r = rubParId(id); if (!r) return;
    ouvertId = id; habEdit = false;
    var p = $('#tiroir'); p.innerHTML = '';
    var inp = h('input', { type: 'text', maxlength: '40', autocomplete: 'off', placeholder: 'Ajouter un article…', 'aria-label': 'Nouvel article' });
    var f = h('form', { class: 't-ajout' }, [inp, h('button', { type: 'submit', 'aria-label': 'Ajouter', text: '＋' })]);
    f.addEventListener('submit', function (e) { e.preventDefault(); var rr = rubParId(ouvertId); if (rr && ajouterArticle(rr, inp.value)) { inp.value = ''; } });
    p.appendChild(h('div', { class: 't-tete' }, [
      h('h2', { id: 't-titre' }),
      h('button', { type: 'button', 'aria-label': 'Modifier le tiroir', text: '⚙', onclick: function () { var rr = rubParId(ouvertId); if (rr) feuilleTiroir(rr); } }),
      h('button', { type: 'button', 'aria-label': 'Fermer le tiroir', text: '✕', onclick: fermerTiroir })
    ]));
    p.appendChild(h('div', { class: 't-corps', id: 't-corps' }, [
      f, h('ul', { class: 't-liste', id: 't-liste' }),
      h('p', { class: 't-vide', id: 't-vide', text: 'Ce tiroir est vide. Touchez un article habituel ou écrivez-en un.' }),
      h('div', { id: 't-bloc-hab' }, [
        h('p', { class: 't-sous' }, [h('span', { text: 'Souvent acheté' }), h('button', { type: 'button', id: 't-hab-mod', onclick: function () { habEdit = !habEdit; majPanneau(); } })]),
        h('div', { class: 'grille', id: 't-hab' })
      ]),
      h('button', { type: 'button', class: 't-ranger', id: 't-ranger', onclick: function () { rangerFaits(ouvertId); } })
    ]));
    majPanneau();
    document.body.classList.add('ouvert');
    if (G.ok) { G.reconstruire(); G.cadrer(id); }
    majBarre();
  }
  function majPanneau() {
    var r = rubParId(ouvertId); if (!r) { fermerTiroir(); return; }
    $('#t-titre').textContent = r.nom;
    var ul = $('#t-liste'); ul.innerHTML = '';
    var nonFaits = r.produits.filter(function (p) { return !p.fait; }), faits = r.produits.filter(function (p) { return p.fait; });
    nonFaits.concat(faits).forEach(function (p) { ul.appendChild(ligneArticle(r, p)); });
    $('#t-vide').hidden = r.produits.length > 0;
    var dispo = r.habitudes.filter(function (x) { return !r.produits.some(function (p) { return memeNom(p.nom, x); }); });
    var g = $('#t-hab'); g.innerHTML = '';
    dispo.forEach(function (x) {
      g.appendChild(h('button', { type: 'button', class: 'hab' + (habEdit ? ' oublier' : ''), text: x,
        'aria-label': (habEdit ? 'Oublier ' : 'Ajouter ') + x,
        onclick: function () {
          var rr = rubParId(ouvertId); if (!rr) return;
          if (habEdit) { rr.habitudes = rr.habitudes.filter(function (y) { return y !== x; }); sauver(); majPanneau(); }
          else ajouterArticle(rr, x);
        } }));
    });
    $('#t-bloc-hab').hidden = !dispo.length && !habEdit;
    var bm = $('#t-hab-mod'); bm.textContent = habEdit ? 'Terminé' : 'Modifier'; bm.hidden = !r.habitudes.length;
    var rg = $('#t-ranger'); rg.hidden = !faits.length;
    rg.textContent = 'Ranger les ' + faits.length + (faits.length > 1 ? ' articles cochés' : ' article coché');
  }
  function fermerTiroir() {
    ouvertId = null;
    document.body.classList.remove('ouvert');
    if (G.ok) G.cadrer(null);
    setTimeout(function () { if (!ouvertId) $('#tiroir').innerHTML = ''; }, 380);
    majBarre();
  }
  function toucherTiroir(id) {
    if (id === '__vide') { feuilleNouveau(); return; }
    if (ouvertId === id) fermerTiroir(); else ouvrirTiroir(id);
  }

  /* ============================== Fenêtres (formulaires et vue d'ensemble) ============================== */
  function fermer() { voile.hidden = true; feuille.innerHTML = ''; feuille.className = ''; feuille.removeAttribute('data-vue'); }
  function ouvrir(noeuds, papier) { feuille.innerHTML = ''; feuille.className = papier ? 'papier' : ''; feuille.removeAttribute('data-vue'); noeuds.forEach(function (n) { feuille.appendChild(n); }); voile.hidden = false; }
  voile.addEventListener('pointerdown', function (e) { if (e.target === voile) fermer(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!voile.hidden) fermer(); else if (ouvertId) fermerTiroir();
  });
  function msgZone() { return h('p', { class: 'msg', role: 'alert' }); }

  function feuilleNouveau() {
    var inNom = h('input', { type: 'text', maxlength: '24', autocomplete: 'off', placeholder: 'Boissons', id: 'f-nom' }), msg = msgZone();
    var f = h('form', { novalidate: 'novalidate' }, [
      h('h2', { text: 'Nouveau tiroir' }),
      h('label', { for: 'f-nom', text: 'Nom du tiroir' }), inNom, msg,
      h('div', { class: 'actions' }, [h('button', { type: 'submit', class: 'ok', text: 'Ajouter' }), h('button', { type: 'button', text: 'Annuler', onclick: fermer })])
    ]);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
