<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon chalet</title>
<link rel="manifest" href="chalet-manifest.webmanifest">
<meta name="theme-color" content="#2b1a10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="chalet-icon-192.png">
<link rel="apple-touch-icon" href="chalet-apple-touch-icon.png">
<style>
  :root {
    --bois: #2b1a10; --bois2: #3d2616; --bois3: #57361f; --trait: #6b4528;
    --creme: #f6ead2; --creme2: #e6d3ac; --muted: #cdb98f;
    --rouge: #b3382c; --rouge2: #d4503f; --sapin: #2f5d3a; --or: #e8b04a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bois); color: var(--creme);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }

  header { flex: none; padding: calc(8px + env(safe-area-inset-top, 0px)) 118px 8px max(14px, env(safe-area-inset-left, 0px)); min-height: 52px; }
  h1 { margin: 0; font: 700 23px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

  #zone { flex: 1; position: relative; min-height: 0; background: #3b2616; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #bandeau { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 2; padding: 8px 12px; border-radius: 12px;
    background: rgba(232,176,74,.95); color: #3b2209; font-size: 13.5px; font-weight: 600; text-align: center; pointer-events: none; }
  #bandeau[hidden] { display: none; }
  #charge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  #charge[hidden] { display: none; }

  #repli { position: absolute; inset: 0; overflow: auto; padding: 12px max(14px, env(safe-area-inset-left, 0px)) 16px; }
  #repli[hidden] { display: none; }
  #repli h2 { margin: 14px 0 6px; font: 700 16px Georgia, serif; }
  #repli .grille { display: flex; flex-wrap: wrap; gap: 8px; }
  #repli .note { color: var(--muted); font-size: 13.5px; margin: 0 0 8px; }

  .puce { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--trait); background: var(--bois3); cursor: pointer; }
  .puce.on { background: var(--rouge); border-color: #e0705f; font-weight: 700; }

  nav { flex: none; display: flex; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    background: var(--bois2); border-top: 1px solid var(--trait); }
  nav button { min-height: 50px; min-width: 0; border-radius: 14px; border: 1px solid var(--trait); background: var(--bois3); font-weight: 600; font-size: 14.5px; padding: 0 11px; cursor: pointer; white-space: nowrap; }
  nav button.actif { background: var(--or); color: #3b2209; border-color: #f3cd82; }
  nav #b-liste { flex: 1; background: var(--rouge); border-color: #e0705f; font-size: 15.5px; padding: 0 8px; }
  nav #b-liste b { display: inline-block; min-width: 26px; margin-left: 6px; padding: 3px 8px; border-radius: 99px; background: var(--creme); color: #6b1d14; font-size: 14px; }

  #voile { position: fixed; inset: 0; z-index: 50; background: rgba(10,5,2,.62); display: flex; align-items: flex-end; justify-content: center; }
  #voile[hidden] { display: none; }
  #feuille { width: 100%; max-width: 520px; max-height: 90dvh; overflow: auto; background: var(--bois2); border: 1px solid var(--trait); border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #feuille h2 { margin: 0 0 12px; font: 700 20px Georgia, "Times New Roman", serif; }
  #feuille label { display: block; margin: 12px 0 5px; font-size: 13.5px; color: var(--muted); }
  #feuille input[type=text], #feuille select { width: 100%; min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--trait); background: #25160d; font-size: 17px; }
  #feuille .case { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; color: var(--creme); }
  #feuille .case input { width: 22px; height: 22px; accent-color: var(--rouge2); }
  #feuille .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  #feuille .actions button { flex: 1; min-height: 50px; border-radius: 14px; border: 1px solid var(--trait); background: var(--bois3); font-weight: 600; font-size: 16px; cursor: pointer; }
  #feuille .actions .ok { background: var(--rouge); border-color: #e0705f; }
  #feuille .actions .danger { background: #2a1a1a; border-color: #8a4137; color: #ffb4a8; }
  #feuille .actions .danger.sur { background: #8c2a20; color: #fff; }
  #feuille .msg { margin: 10px 0 0; font-size: 14px; color: #ffb4a8; min-height: 1em; }
  #feuille .vide { color: var(--muted); margin: 6px 0 0; }
  #feuille .rub { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #feuille .grille { display: flex; flex-wrap: wrap; gap: 8px; }
  #feuille .puce { background: var(--bois3); font-size: 16px; }
  #feuille .puce::after { content: " ✓"; color: var(--or); }
  #feuille .aide { margin: 0 0 4px; font-size: 13.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Mon chalet</h1>
  <p>Touchez un produit : il avance et rejoint votre liste.</p>
</header>

<div id="zone">
  <canvas id="scene" tabindex="0" role="img" aria-label="Étagères du chalet en 3D. Glissez pour parcourir, touchez un produit pour l'ajouter à la liste à acheter."></canvas>
  <div id="bandeau" hidden>Mode rangement : touchez un produit ou une étiquette pour la modifier.</div>
  <div id="charge">Le chalet se prépare…</div>
  <div id="repli" hidden></div>
</div>

<nav>
  <button type="button" id="b-ajout">＋ Ajouter</button>
  <button type="button" id="b-rang">✎ Ranger</button>
  <button type="button" id="b-liste">À acheter<b id="n-achat">0</b></button>
</nav>

<div id="voile" hidden><div id="feuille" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  function h(tag, props, kids) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      if (k === 'text') e.textContent = props[k];
      else if (k === 'class') e.className = props[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  /* ============================== Données ============================== */
  var CLE = 'chalet-donnees-v1';
  var PAR_RANGEE = 4;
  function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function defaut() {
    function r(nom, l) { return { id: uid(), nom: nom, produits: l.map(function (n) { return { id: uid(), nom: n }; }) }; }
    return { rubriques: [
      r('Garde-manger', ['Café', 'Pâtes', 'Riz', 'Huile']),
      r('Frais', ['Beurre', 'Lait', 'Œufs', 'Fromage']),
      r('Maison', ['Savon', 'Éponges', 'Lessive', 'Essuie-tout']),
      r('Matériel', ['Ampoules', 'Piles', 'Vis', 'Gaz'])
    ], achat: {} };
  }
  function charger() {
    try {
      var t = localStorage.getItem(CLE);
      if (t) {
        var o = JSON.parse(t);
        if (o && Array.isArray(o.rubriques)) {
          o.achat = o.achat || {};
          var ids = {};
          o.rubriques.forEach(function (r) { r.produits = r.produits || []; r.produits.forEach(function (p) { ids[p.id] = 1; }); });
          Object.keys(o.achat).forEach(function (k) { if (!ids[k]) delete o.achat[k]; });
          return o;
        }
      }
    } catch (e) {}
    return defaut();
  }
  var D = charger();
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(D)); } catch (e) {} }
  sauver();
  function trouverProd(id) {
    for (var i = 0; i < D.rubriques.length; i++) for (var j = 0; j < D.rubriques[i].produits.length; j++)
      if (D.rubriques[i].produits[j].id === id) return D.rubriques[i].produits[j];
    return null;
  }
  function rubDe(id) {
    for (var i = 0; i < D.rubriques.length; i++) for (var j = 0; j < D.rubriques[i].produits.length; j++)
      if (D.rubriques[i].produits[j].id === id) return D.rubriques[i];
    return null;
  }
  function rubParId(id) { return D.rubriques.filter(function (r) { return r.id === id; })[0] || null; }
  function nbAchat() { return Object.keys(D.achat).length; }
  function hash(s) { var x = 7; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }

  /* ============================== Interface ============================== */
  var modeRangement = false;
  var voile = $('#voile'), feuille = $('#feuille');
  function fermer() { voile.hidden = true; feuille.innerHTML = ''; }
  function ouvrir(noeuds) { feuille.innerHTML = ''; noeuds.forEach(function (n) { feuille.appendChild(n); }); voile.hidden = false; }
  voile.addEventListener('pointerdown', function (e) { if (e.target === voile) fermer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !voile.hidden) fermer(); });

  function majBarre() {
    $('#n-achat').textContent = nbAchat();
    $('#b-rang').textContent = modeRangement ? '✓ Terminé' : '✎ Ranger';
    $('#b-rang').classList.toggle('actif', modeRangement);
    $('#bandeau').hidden = !modeRangement;
    if (!G.ok) dessinerRepli();
  }
  function vibrer() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }

  function basculer(id) {
    if (D.achat[id]) delete D.achat[id]; else D.achat[id] = true;
    sauver(); vibrer();
    if (G.ok) G.maj(id);
    majBarre();
    if (!voile.hidden && feuille.getAttribute('data-vue') === 'liste') feuilleListe();
  }
  function toucherProduit(id) {
    var p = trouverProd(id); if (!p) return;
    if (modeRangement) feuilleProduit(p); else basculer(id);
  }
  function toucherRub(id) { var r = rubParId(id); if (r && modeRangement) feuilleRubrique(r); }

  function msgZone() { return h('p', { class: 'msg', role: 'alert' }); }

  function feuilleProduit(p) {
    var ajout = !p;
    var rub0 = ajout ? (D.rubriques[0] ? D.rubriques[0].id : '+') : rubDe(p.id).id;
    var inNom = h('input', { type: 'text', maxlength: '28', autocomplete: 'off', placeholder: 'Allumettes', id: 'f-nom' });
    inNom.value = p ? p.nom : '';
    var sel = h('select', { id: 'f-rub' }, D.rubriques.map(function (r) { return h('option', { value: r.id, text: r.nom }); })
      .concat([h('option', { value: '+', text: '＋ Nouvelle rubrique…' })]));
    sel.value = rub0;
    var inRub = h('input', { type: 'text', maxlength: '24', autocomplete: 'off', placeholder: 'Nom de la nouvelle rubrique', 'aria-label': 'Nom de la nouvelle rubrique' });
    var blocRub = h('div', {}, [inRub]); blocRub.hidden = sel.value !== '+';
    sel.addEventListener('change', function () { blocRub.hidden = sel.value !== '+'; if (!blocRub.hidden) inRub.focus(); });
    var cb = h('input', { type: 'checkbox', id: 'f-achat' }); cb.checked = true;
    var msg = msgZone();
    var btnSup = null;
    var actions = [h('button', { type: 'submit', class: 'ok', text: ajout ? 'Ajouter' : 'Enregistrer' })];
    if (!ajout) {
      btnSup = h('button', { type: 'button', class: 'danger', text: 'Supprimer' });
      var arme = false;
      btnSup.addEventListener('click', function () {
        if (!arme) { arme = true; btnSup.classList.add('sur'); btnSup.textContent = 'Toucher encore pour supprimer'; return; }
        var r = rubDe(p.id); r.produits = r.produits.filter(function (x) { return x.id !== p.id; });
        delete D.achat[p.id]; sauver(); fermer(); G.ok && G.reconstruire(); majBarre();
      });
      actions.push(btnSup);
    }
    actions.push(h('button', { type: 'button', text: 'Annuler', onclick: fermer }));
    var f = h('form', { novalidate: 'novalidate' }, [
      h('h2', { text: ajout ? 'Ajouter un produit' : 'Modifier le produit' }),
      h('label', { for: 'f-nom', text: 'Nom du produit' }), inNom,
      h('label', { for: 'f-rub', text: 'Rubrique (l\'étagère)' }), sel, blocRub,
      ajout ? h('label', { class: 'case' }, [cb, 'Mettre aussi dans la liste à acheter']) : null,
      msg, h('div', { class: 'actions' }, actions)
    ]);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var nom = inNom.value.replace(/\s+/g, ' ').trim();
      if (!nom) { msg.textContent = 'Écrivez le nom du produit.'; inNom.focus(); return; }
      var rub;
      if (sel.value === '+') {
        var rn = inRub.value.replace(/\s+/g, ' ').trim();
        if (!rn) { msg.textContent = 'Écrivez le nom de la nouvelle rubrique.'; inRub.focus(); return; }
        rub = { id: uid(), nom: rn, produits: [] }; D.rubriques.push(rub);
      } else rub = rubParId(sel.value);
      var id;
      if (ajout) {
        id = uid(); rub.produits.push({ id: id, nom: nom });
        if (cb.checked) D.achat[id] = true;
      } else {
        id = p.id; p.nom = nom;
        var ancienne = rubDe(p.id);
        if (ancienne !== rub) { ancienne.produits = ancienne.produits.filter(function (x) { return x.id !== p.id; }); rub.produits.push(p); }
      }
      sauver(); fermer(); if (G.ok) { G.reconstruire(); G.montrer(id); } majBarre();
    });
    feuille.removeAttribute('data-vue');
    ouvrir([f]);
    if (ajout) setTimeout(function () { inNom.focus(); }, 60);
  }

  function feuilleRubrique(r) {
    var inNom = h('input', { type: 'text', maxlength: '24', autocomplete: 'off', id: 'f-rn' }); inNom.value = r.nom;
    var msg = msgZone();
    var sup = h('button', { type: 'button', class: 'danger', text: 'Supprimer la rubrique' });
    var arme = false;
    sup.addEventListener('click', function () {
      if (r.produits.length) { msg.textContent = 'Retirez d\'abord les produits de cette rubrique.'; return; }
      if (!arme) { arme = true; sup.classList.add('sur'); sup.textContent = 'Toucher encore pour supprimer'; return; }
      D.rubriques = D.rubriques.filter(function (x) { return x !== r; }); sauver(); fermer(); G.ok && G.reconstruire(); majBarre();
    });
    var f = h('form', { novalidate: 'novalidate' }, [
      h('h2', { text: 'Modifier la rubrique' }),
      h('label', { for: 'f-rn', text: 'Nom de la rubrique' }), inNom, msg,
      h('div', { class: 'actions' }, [h('button', { type: 'submit', class: 'ok', text: 'Enregistrer' }), sup, h('button', { type: 'button', text: 'Annuler', onclick: fermer })])
    ]);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var nom = inNom.value.replace(/\s+/g, ' ').trim();
      if (!nom) { msg.textContent = 'Écrivez un nom.'; return; }
      r.nom = nom; sauver(); fermer(); G.ok && G.reconstruire(); majBarre();
    });
    feuille.removeAttribute('data-vue');
    ouvrir([f]);
  }

  function feuilleListe() {
    var n = nbAchat(), blocs = [h('h2', { text: n ? 'À acheter (' + n + ')' : 'À acheter' })];
    if (!n) {
      blocs.push(h('p', { class: 'vide', text: 'Rien à acheter pour l\'instant. Touchez un produit sur l\'étagère : il avance et arrive ici.' }));
    } else {
      blocs.push(h('p', { class: 'aide', text: 'Touchez un produit quand il est dans le panier : il retourne sur son étagère.' }));
      D.rubriques.forEach(function (r) {
        var l = r.produits.filter(function (p) { return D.achat[p.id]; });
        if (!l.length) return;
        blocs.push(h('p', { class: 'rub', text: r.nom }));
        blocs.push(h('div', { class: 'grille' }, l.map(function (p) {
          return h('button', { type: 'button', class: 'puce', text: p.nom, 'aria-label': p.nom + ', dans le panier', onclick: function () { basculer(p.id); } });
        })));
      });
    }
    var actions = [];
    if (n) {
      var vider = h('button', { type: 'button', class: 'danger', text: 'Tout vider' }), arme = false;
      vider.addEventListener('click', function () {
        if (!arme) { arme = true; vider.classList.add('sur'); vider.textContent = 'Toucher encore pour tout vider'; return; }
        D.achat = {}; sauver(); if (G.ok) G.majTout(); majBarre(); feuilleListe();
      });
      actions.push(vider);
    }
    actions.push(h('button', { type: 'button', class: 'ok', text: 'Fermer', onclick: fermer }));
    blocs.push(h('div', { class: 'actions' }, actions));
    ouvrir(blocs); feuille.setAttribute('data-vue', 'liste');
  }

  $('#b-ajout').addEventListener('click', function () { feuilleProduit(null); });
  $('#b-liste').addEventListener('click', feuilleListe);
  $('#b-rang').addEventListener('click', function () { modeRangement = !modeRangement; if (G.ok) G.majTout(); majBarre(); });

  /* Secours sans 3D : simple liste de boutons rangés par rubrique */
  function dessinerRepli() {
    var z = $('#repli'); z.hidden = false; z.innerHTML = '';
    z.appendChild(h('p', { class: 'note', text: 'La 3D n\'est pas disponible ici : voici vos étagères en liste.' }));
    D.rubriques.forEach(function (r) {
      var t = h('h2', { text: r.nom }); if (modeRangement) { t.style.cursor = 'pointer'; t.addEventListener('click', function () { toucherRub(r.id); }); }
      z.appendChild(t);
      z.appendChild(h('div', { class: 'grille' }, r.produits.map(function (p) {
        return h('button', { type: 'button', class: 'puce' + (D.achat[p.id] ? ' on' : ''), text: p.nom, onclick: function () { toucherProduit(p.id); } });
      })));
    });
  }

  /* ============================== Scène 3D ============================== */
  var G = { ok: false, maj: function () {}, majTout: function () {}, reconstruire: function () {}, montrer: function () {} };

  function demarrer3D() {
    if (typeof THREE === 'undefined') return false;
    var canvas = $('#scene'), zone = $('#zone');
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); } catch (e) { return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x3b2616);
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    canvas.addEventListener('webglcontextrestored', function () { location.reload(); });

    var scene = new THREE.Scene();
    var cam = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
    var TAN = Math.tan(18 * Math.PI / 180);
    var meuble = new THREE.Group(); scene.add(meuble);
    var items = [], cibles = [], parId = {};

    /* ---- mesures du meuble (en mètres) ---- */
    var LARG = 3.6, COTE = 0.2, INT = LARG - 2 * COTE, PROF = 0.7;
    var RH = 1.0, BT = 0.26, SOCLE = 0.22, CAP = 0.06, HW = 2.0, RHT = 1.5, VUE_L = 4.25;
    var IW = 0.64, IGAP = 0.12;
    var HAUT = 6;

    function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }

    /* ---- textures dessinées (bois, tapis, étiquettes) ---- */
    function aleat(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function teinte(c, d) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.max(0, Math.min(255, Math.round(c[i] + d))); }).join(',') + ')'; }
    function boisCanvas(taille, o) {
      var c = document.createElement('canvas'); c.width = c.height = taille;
      var g = c.getContext('2d'), R = aleat(o.seed), n = o.planches, L = taille / n;
      function pt(a, l) { return o.vertical ? [a, l] : [l, a]; }
      for (var i = 0; i < n; i++) {
        var a0 = i * L, p0 = pt(a0, 0);
        g.fillStyle = teinte(o.base, (R() - 0.5) * o.var);
        g.fillRect(p0[0], p0[1], o.vertical ? L : taille, o.vertical ? taille : L);
        var nv = Math.round(L / 2.2);
        for (var k = 0; k < nv; k++) {
          var a = a0 + R() * L, ph = R() * 6.28, fr = 0.006 + R() * 0.02, am = 1 + R() * 3;
          g.strokeStyle = 'rgba(' + o.veine + ',' + (0.06 + R() * 0.17).toFixed(3) + ')'; g.lineWidth = 0.6 + R() * 1.5;
          g.beginPath();
          for (var l = 0; l <= taille; l += 8) {
            var q = pt(a + Math.sin(l * fr + ph) * am, l);
            if (l === 0) g.moveTo(q[0], q[1]); else g.lineTo(q[0], q[1]);
          }
          g.stroke();
        }

    function pxParM() { return canvas.clientHeight / (2 * dist() * TAN); }

    var raf = 0, enMain = false;
    function etape() {
      var bouge = false;
      items.forEach(function (it) {
        var cible = D.achat[it.id] ? 1 : 0, dd = cible - it.a;
        if (Math.abs(dd) > 0.003) { it.a += dd * 0.2; bouge = true; } else it.a = cible;
        it.g.position.z = it.a * 0.42; it.g.position.y = it.y0 + it.a * 0.03;
        var s = 1 + it.a * 0.07; it.g.scale.set(s, s, s);
      });
      if (!enMain) {
        if (Math.abs(vue.yaw) > 0.002) { vue.yaw *= 0.9; bouge = true; } else vue.yaw = 0;
        if (Math.abs(vue.vy) > 0.0006) { vue.ty += vue.vy; vue.vy *= 0.93; bouge = true; } else vue.vy = 0;
      }
      placer(); renderer.render(scene, cam);
      return bouge || enMain;
    }
    function boucle() { raf = 0; if (etape()) raf = requestAnimationFrame(boucle); }
    function demander() { if (!raf) raf = requestAnimationFrame(boucle); }

    function redim() {
      var r = zone.getBoundingClientRect(), w = Math.max(50, Math.round(r.width)), hgt = Math.max(50, Math.round(r.height));
      renderer.setSize(w, hgt, false); asp = w / hgt; cam.aspect = asp; cam.updateProjectionMatrix(); demander();
    }
    if (window.ResizeObserver) new ResizeObserver(redim).observe(zone); else window.addEventListener('resize', redim);

    /* ---- gestes : glisser = défiler, pincer = zoomer, toucher = choisir ---- */
    var ptr = {}, depart = null, pince = null, dernier = 0;
    function nbPtr() { return Object.keys(ptr).length; }
    canvas.addEventListener('pointerdown', function (e) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
      ptr[e.pointerId] = { x: e.clientX, y: e.clientY };
      enMain = true; vue.vy = 0;
      if (nbPtr() === 1) depart = { x: e.clientX, y: e.clientY, t: Date.now(), d: 0 };
      else if (nbPtr() === 2) { var k = Object.keys(ptr), a = ptr[k[0]], b = ptr[k[1]]; pince = { d0: Math.hypot(a.x - b.x, a.y - b.y), z0: vue.zoom }; if (depart) depart.d = 99; }
      canvas.style.cursor = 'grabbing'; demander();
    });
    canvas.addEventListener('pointermove', function (e) {
      var p = ptr[e.pointerId]; if (!p) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (nbPtr() === 1) {
        if (depart) depart.d += Math.abs(dx) + Math.abs(dy);
        var dv = dy / pxParM(); vue.ty += dv; vue.vy = dv; dernier = Date.now();
        vue.yaw = Math.max(-0.5, Math.min(0.5, vue.yaw - dx * 0.003));
      } else if (nbPtr() === 2 && pince) {
        var k = Object.keys(ptr), a = ptr[k[0]], b = ptr[k[1]];
        vue.zoom = Math.max(1, Math.min(2.4, pince.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pince.d0));
      }
      demander();
    });
    function fin(e) {
      if (!ptr[e.pointerId]) return;
      var seul = nbPtr() === 1; delete ptr[e.pointerId];
      if (nbPtr() < 2) pince = null;
      if (!nbPtr()) {
        enMain = false; canvas.style.cursor = 'grab';
        if (Date.now() - dernier > 90) vue.vy = 0;
        if (seul && depart && depart.d < 10 && Date.now() - depart.t < 600 && e.type === 'pointerup') choisir(e.clientX, e.clientY);
        depart = null;
      }
      demander();
    }
    canvas.addEventListener('pointerup', fin); canvas.addEventListener('pointercancel', fin);
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (e.ctrlKey) vue.zoom = Math.max(1, Math.min(2.4, vue.zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
      else vue.ty -= e.deltaY / pxParM();
      demander();
    }, { passive: false });
    canvas.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') vue.ty += 0.6; else if (e.key === 'ArrowDown') vue.ty -= 0.6; else return;
      e.preventDefault(); demander();
    });

    var rc = new THREE.Raycaster(), vec = new THREE.Vector2();
    function choisir(cx, cy) {
      var r = canvas.getBoundingClientRect();
      vec.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
      placer(); cam.updateMatrixWorld(); meuble.updateMatrixWorld(true);
      rc.setFromCamera(vec, cam);
      var hits = rc.intersectObjects(cibles, false);
      if (!hits.length) return;
      var u = hits[0].object.userData;
      if (u.type === 'produit') toucherProduit(u.id); else if (u.type === 'rubrique') toucherRub(u.id);
    }

    /* ---- liens avec le reste de l'appli ---- */
    G.ok = true;
    G.reconstruire = reconstruire;
    G.maj = function (id) { teinter(); demander(); };
    G.majTout = function () { teinter(); demander(); };
    G.montrer = function (id) {
      var it = parId[id]; if (!it) return;
      vue.ty = it.y0 + 0.5; demander();
    };
    G.etat = function () { return { items: items.length, cibles: cibles.length, ty: vue.ty, haut: HAUT, zoom: vue.zoom }; };
    G.ecran = function (type, id) {
      var o = cibles.filter(function (c) { return c.userData.type === type && c.userData.id === id; })[0];
      if (!o) return null;
      placer(); cam.updateMatrixWorld(); meuble.updateMatrixWorld(true);
      var v = new THREE.Vector3(); o.getWorldPosition(v); v.project(cam);
      var r = canvas.getBoundingClientRect();
      return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
    };
    window.__chalet = G;

    redim(); reconstruire(); vue.ty = limites()[1]; demander();
    return true;
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('chalet-sw.js').catch(function () {}); } catch (e) {}
  }
  var ok3D = false;
  try { ok3D = demarrer3D(); } catch (e) { ok3D = false; if (window.console) console.error(e); }
  $('#charge').hidden = true;
  if (!ok3D) { $('#scene').style.display = 'none'; G.ok = false; }
  majBarre();
})();
</script>

<script>

(function(){
  "use strict";
  var A=window.MAJ_APPLI; if(!A||document.getElementById("maj-pastille")) return;

    }).catch(function(){}).then(go,go);

    }).catch(function(){});
